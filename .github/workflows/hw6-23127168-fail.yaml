name: Automated API tests using Postman CLI of hw6-23127168

on: push

jobs:
  automated-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci
      - name: Start backend server
        working-directory: ./backend
        run: |
          node database.js
          node server.js &
          sleep 5
      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY_23127168 }}
      - name: Run API tests
        run: |
          postman collection run "55677974-2ff7ad55-5ee3-4d81-a1b2-d2f4c1f48d3b"