name: Automated API tests for admin CRUD products scenario

on: workflow_dispatch

jobs:
  automated-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Start backend server
        working-directory: ./backend
        run: |
          node database.js
          node server.js &
          sleep 5

      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY_23127168 }}

      - name: Run API tests
        run: |
          postman collection run "55677974-a723ccfd-0ed8-4c07-997c-217c69b1def7" -e "55677974-f29d22c7-0424-4ebb-814d-abf3eac0e79d"