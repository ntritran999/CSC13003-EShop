name: HW06 23127234 - passing API tests

on: push

jobs:
  automated-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Start backend server
        working-directory: ./backend
        run: |
          node server.js &
          sleep 5

      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY_23127234 }}

      - name: Run passing API tests
        run: |
          postman collection run "homeworks/hw06/23127234 - Nguyen An Nghiep/do-cicd/HW06_23127234_recorded_passed_subset.postman_collection.json" \
            --env-var "baseUrl=http://127.0.0.1:3000" \
            --env-var "studentId=23127234" \
            --env-var "adminEmail=admin@eshop.com" \
            --env-var "adminPassword=Admin123!" \
            --env-var "userEmail=test@eshop.com" \
            --env-var "userPassword=Test1234!" \
            --env-var "jwtSecret=super_secret_key_that_should_not_be_here"
